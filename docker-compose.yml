version: "3.9"

# Local development infrastructure only.
# Production uses Render Managed PostgreSQL + Render Key Value.
services:
  postgres:
    image: postgres:16-alpine
    container_name: botflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: botflow
      POSTGRES_PASSWORD: botflow_dev_pass
      POSTGRES_DB: botflow_ads
    ports:
      - "5432:5432"
    volumes:
      - botflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U botflow -d botflow_ads"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: botflow-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - botflow_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  botflow_pgdata:
  botflow_redisdata:
